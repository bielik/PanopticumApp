<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PANOPTICUM — Exhibition</title>
    <link rel="stylesheet" href="/static/style.css?v=7">
</head>
<body class="exhibit-mode">
    <div class="video-container">
        <img src="/stream" alt="Live Feed">
        <div class="scanlines"></div>
        <div class="vignette"></div>
        <div class="overlay">
            <!-- Top bar (CCTV only) -->
            <div class="overlay-top">
                <span class="timestamp" id="timestamp"></span>
                <div class="rec-indicator">
                    <span class="rec-dot" id="rec-dot"></span>
                    <span>REC</span>
                </div>
            </div>

            <!-- Camera label (CCTV only) -->
            <span class="cam-label">CAM-01</span>

            <!-- Lyrics overlay (CCTV/judgmental only) -->
            <div class="cctv-lyrics" id="cctv-lyrics"></div>

            <!-- Motivational message (Insta only) -->
            <div class="motivational-message" id="motivational-message"><span class="motivational-message-text" id="motivational-text"></span></div>
        </div>
    </div>

    <script src="/static/app.js?v=7"></script>
</body>
</html>
