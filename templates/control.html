<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PANOPTICUM — {{ room_code }}</title>
    <link rel="stylesheet" href="/static/style.css?v=21">
</head>
<body>
    <div class="loading-screen" id="loading-screen"></div>
    <div class="dashboard">
        <!-- Video panel -->
        <div class="video-panel">
            <div class="video-container" id="video-container">
                <img id="worker-stream" src="" alt="Live Feed">
                <video id="local-video" autoplay playsinline muted style="display:none"></video>
                <canvas id="capture-canvas" style="display:none"></canvas>
                <div class="scanlines"></div>
                <div class="vignette"></div>
                <div class="overlay">
                    <div class="overlay-top">
                        <span class="timestamp" id="timestamp"></span>
                        <div class="rec-indicator">
                            <span class="rec-dot" id="rec-dot"></span>
                            <span>REC</span>
                        </div>
                    </div>
                    <span class="cam-label">CAM-01</span>
                    <div class="cctv-lyrics" id="cctv-lyrics"></div>
                    <div class="motivational-message" id="motivational-message"><span class="motivational-message-text" id="motivational-text"></span></div>
                </div>
            </div>

            <!-- Controls panel -->
            <div class="controls">
                <button class="start-stop-btn inactive" id="start-stop-btn">START PANOPTICUM</button>
                <a href="/room/{{ room_code }}/worker" target="_blank" class="worker-link">Worker &#8599;</a>

                <div class="controls-center">
                    <div class="controls-row">
                        <div class="control-group">
                            <span class="control-label">Effect</span>
                            <div class="pill-group" id="effect-pills">
                                <button class="pill-btn" data-effect="insta">Insta</button>
                                <button class="pill-btn active" data-effect="natural">Natural</button>
                                <button class="pill-btn" data-effect="cctv">CCTV</button>
                            </div>
                        </div>

                        <div class="sync-toggle">
                            <label class="sync-label" for="sync-checkbox">
                                <input type="checkbox" id="sync-checkbox" checked>
                                <span class="sync-switch"></span>
                                <span class="sync-text">Sync</span>
                            </label>
                        </div>
                    </div>

                    <div class="control-group">
                        <span class="control-label">Tone</span>
                        <div class="pill-group" id="tone-pills">
                            <button class="pill-btn" data-tone="0">Supportive</button>
                            <button class="pill-btn active" data-tone="0.5">Neutral</button>
                            <button class="pill-btn" data-tone="1">Judgmental</button>
                        </div>
                    </div>

                    <div class="control-group">
                        <span class="control-label">Frequency</span>
                        <div class="slider-control">
                            <input type="range" id="frequency-slider" class="range-slider"
                                   min="0" max="100" step="1" value="19">
                            <span class="slider-value" id="frequency-value">8s</span>
                        </div>
                    </div>

                    <div class="control-group">
                        <span class="control-label">Comment Length</span>
                        <div class="slider-control">
                            <input type="range" id="comment-length-slider" class="range-slider"
                                   min="3" max="50" step="1" value="10">
                            <span class="slider-value" id="comment-length-value">10 words</span>
                        </div>
                    </div>
                </div>

                <!-- Action mode -->
                <div class="action-panel" id="action-panel">
                    <div class="control-group">
                        <span class="control-label">Action Mode</span>
                        <div class="pill-group" id="action-setting-pills">
                            <button class="pill-btn active" data-action-setting="manual">Manual</button>
                            <button class="pill-btn" data-action-setting="automatic">Automatic</button>
                        </div>
                    </div>
                    <div class="action-status" id="action-status">
                        <span class="action-phase-label" id="action-phase-label">Commenting</span>
                        <span class="action-requested-text" id="action-requested-text"></span>
                    </div>
                    <button class="action-trigger-btn" id="action-trigger-btn">Request Action</button>
                </div>
            </div>

            <!-- Source controls -->
            <div class="controls-source" id="source-controls">
                <span class="source-status" id="source-status"></span>
                <div class="camera-select-wrap" id="camera-select-wrap" style="display:none">
                    <label class="control-label" for="camera-select">Camera</label>
                    <select id="camera-select" class="camera-select"></select>
                </div>
            </div>

            <!-- Connected devices panel -->
            <div class="client-panel" id="client-panel">
                <div class="client-panel-header">
                    <span class="control-label">Connected Devices</span>
                </div>
                <div class="client-list" id="client-list"></div>
            </div>
        </div>

        <!-- Message log panel -->
        <div class="message-log" id="message-log">
            <div class="message-log-header">
                <span>Activity Log</span>
                <button class="log-collapse-btn" id="log-collapse-btn" title="Collapse log">&times;</button>
            </div>
            <div class="message-log-list" id="message-log-list">
                <div class="message-log-empty">Waiting for observations...</div>
            </div>
        </div>

        <!-- Floating expand button (visible when log is collapsed) -->
        <button class="log-expand-btn" id="log-expand-btn" title="Show activity log">&#9776;</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="/static/jquery.ripples.js"></script>
    <script>
        try {
            var c = document.createElement('canvas');
            c.width = 1; c.height = 1;
            var ctx = c.getContext('2d');
            ctx.fillStyle = '#7a9a86';
            ctx.fillRect(0, 0, 1, 1);
            $('#loading-screen').ripples({
                resolution: 512,
                dropRadius: 20,
                perturbance: 0.04,
                interactive: false,
                imageUrl: c.toDataURL()
            });
            var ls = document.getElementById('loading-screen');
            window._loadingDrops = setInterval(function() {
                if (ls.style.display === 'none') return;
                $('#loading-screen').ripples('drop', ls.clientWidth / 2, ls.clientHeight / 2, 20, 0.04);
            }, 800);
        } catch (e) {}
    </script>
    <script>
        // Room code injected by server
        window.ROOM_CODE = "{{ room_code }}";
        window.PAGE_MODE = "controller";
    </script>
    <script src="/static/app.js?v=22"></script>
</body>
</html>
