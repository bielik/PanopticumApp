<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PANOPTICUM — {{ room_code }}</title>
    <link rel="stylesheet" href="/static/style.css?v=10">
</head>
<body>
    <div class="dashboard">
        <!-- Video panel -->
        <div class="video-panel">
            <div class="video-container" id="video-container">
                <img id="exhibit-stream" src="" alt="Live Feed">
                <video id="local-video" autoplay playsinline muted style="display:none"></video>
                <canvas id="capture-canvas" style="display:none"></canvas>
                <div class="scanlines"></div>
                <div class="vignette"></div>
                <div class="overlay">
                    <div class="overlay-top">
                        <span class="timestamp" id="timestamp"></span>
                        <div class="rec-indicator">
                            <span class="rec-dot" id="rec-dot"></span>
                            <span>REC</span>
                        </div>
                    </div>
                    <span class="cam-label">CAM-01</span>
                    <div class="cctv-lyrics" id="cctv-lyrics"></div>
                    <div class="motivational-message" id="motivational-message"><span class="motivational-message-text" id="motivational-text"></span></div>
                </div>
            </div>

            <!-- Controls panel -->
            <div class="controls">
                <button class="start-stop-btn inactive" id="start-stop-btn">START</button>
                <a href="/room/{{ room_code }}/exhibit" target="_blank" class="exhibit-link">Exhibition &#8599;</a>

                <div class="controls-center">
                    <div class="control-group">
                        <span class="control-label">Effect</span>
                        <div class="pill-group" id="effect-pills">
                            <button class="pill-btn" data-effect="insta">Insta</button>
                            <button class="pill-btn active" data-effect="natural">Natural</button>
                            <button class="pill-btn" data-effect="cctv">CCTV</button>
                        </div>
                    </div>

                    <div class="sync-toggle">
                        <label class="sync-label" for="sync-checkbox">
                            <input type="checkbox" id="sync-checkbox" checked>
                            <span class="sync-switch"></span>
                            <span class="sync-text">Sync</span>
                        </label>
                    </div>

                    <div class="control-group">
                        <span class="control-label">Tone</span>
                        <div class="pill-group" id="tone-pills">
                            <button class="pill-btn" data-tone="0">Supportive</button>
                            <button class="pill-btn active" data-tone="0.5">Neutral</button>
                            <button class="pill-btn" data-tone="1">Judgmental</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Source controls -->
            <div class="controls-source" id="source-controls">
                <span class="source-status" id="source-status"></span>
                <div class="camera-select-wrap" id="camera-select-wrap" style="display:none">
                    <label class="control-label" for="camera-select">Camera</label>
                    <select id="camera-select" class="camera-select"></select>
                </div>
            </div>

            <!-- Connected devices panel -->
            <div class="client-panel" id="client-panel">
                <div class="client-panel-header">
                    <span class="control-label">Connected Devices</span>
                </div>
                <div class="client-list" id="client-list"></div>
            </div>
        </div>

        <!-- Message log panel -->
        <div class="message-log" id="message-log">
            <div class="message-log-header">
                <span>Activity Log</span>
                <button class="log-collapse-btn" id="log-collapse-btn" title="Collapse log">&times;</button>
            </div>
            <div class="message-log-list" id="message-log-list">
                <div class="message-log-empty">Waiting for observations...</div>
            </div>
        </div>

        <!-- Floating expand button (visible when log is collapsed) -->
        <button class="log-expand-btn" id="log-expand-btn" title="Show activity log">&#9776;</button>
    </div>

    <script>
        // Room code injected by server
        window.ROOM_CODE = "{{ room_code }}";
        window.PAGE_MODE = "controller";
    </script>
    <script src="/static/app.js?v=10"></script>
</body>
</html>
