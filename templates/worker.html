<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PANOPTICUM — Worker</title>
    <link rel="stylesheet" href="/static/style.css?v=15">
</head>
<body class="worker-mode">
    <div class="video-container">
        <img id="worker-stream" src="" alt="Live Feed">
        <video id="local-video" autoplay playsinline muted style="display:none; width:100%; height:100%; object-fit:cover;"></video>
        <canvas id="capture-canvas" style="display:none"></canvas>
        <div class="scanlines"></div>
        <div class="vignette"></div>
        <div class="overlay">
            <!-- Top bar (CCTV only) -->
            <div class="overlay-top">
                <span class="timestamp" id="timestamp"></span>
                <div class="rec-indicator">
                    <span class="rec-dot" id="rec-dot"></span>
                    <span>REC</span>
                </div>
            </div>

            <!-- Camera label (CCTV only) -->
            <span class="cam-label">CAM-01</span>

            <!-- Lyrics overlay (CCTV/judgmental only) -->
            <div class="cctv-lyrics" id="cctv-lyrics"></div>

            <!-- Motivational message (Insta only) -->
            <div class="motivational-message" id="motivational-message"><span class="motivational-message-text" id="motivational-text"></span></div>
        </div>

        <!-- Worker idle message (shown when session is not active) -->
        <div class="worker-idle-message" id="worker-idle-message">
            <p>Panopticum Interrupted</p>
            <p class="worker-idle-sub">Wait for instructions from the control room</p>
        </div>

        <!-- Audio elements for TTS playback -->
        <audio id="audio-player" preload="none"></audio>
        <audio id="audio-robotic-player" preload="none"></audio>
    </div>

    <script>
        window.ROOM_CODE = "{{ room_code }}";
        window.PAGE_MODE = "worker";
    </script>
    <script src="/static/app.js?v=18"></script>
</body>
</html>
